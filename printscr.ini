; printscr 配置文件
;
; 程序按以下顺序查找本文件：
;   1. 可执行文件所在目录（构建时会把本文件复制过去）
;   2. 当前工作目录
; 文件缺失或某个键缺失时，使用下面的默认值。
; 注释可用 ; 或 #，值不要加引号。

[output]
; SDR 基础图层的 JPEG 质量（0~100）。这是保存文件里“普通看图软件看到的那一层”，
; 内容与按回车复制到剪贴板的像素完全一致
quality=97

; 增益图（gain map）的 JPEG 质量（0~100）。增益图决定 HDR 端的亮度/颜色还原精度
gainmap_quality=90

; 增益图相对基础图的下采样倍数。1 = 全分辨率，2/4/8 更省体积但高光边缘更粗
gainmap_scale_factor=1

; 1 = 三分量增益图（保留彩色高光），0 = 单通道（只保留亮度差异，体积更小）
multi_channel_gainmap=1

; 增益图编码 gamma，通常保持 1.0
gainmap_gamma=1.0

; 目标显示峰值亮度（nits），写入 gain map 元数据的 hdr_capacity_max。
; 0 = 自动取当前显示器实测的 HDR 峰值，取不到时按 1000
target_display_peak_nits=0

; 归一化用的 SDR 白点（nits）。增益图是相对 SDR 白点的比值，必须和抓屏时系统真正的
; SDR 白点一致，否则播放端会整体偏亮或偏暗（例如系统白点 80、这里写 203 就会暗 2.5 倍）。
; 0 = 自动取系统实测值（HDR 模式下任务栏“SDR 内容亮度”对应的绝对亮度）
sdr_white_nits=0

; 编码预设：best_quality（质量优先）或 realtime（速度优先）
preset=best_quality
